AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Lucky Numbers online play (API Gateway WebSocket + Lambda + DynamoDB)

Parameters:
  BudgetEmail:
    Type: String
    Default: ''
    Description: Email address for the monthly cost alert (leave empty to skip creating the budget)
  BudgetEmail2:
    Type: String
    Default: ''
    Description: Second email address for the monthly cost alert (optional)
  BudgetLimitUsd:
    Type: Number
    Default: 1
    Description: Monthly cost (USD) of the whole account that triggers the alert

Conditions:
  CreateBudget: !Not [!Equals [!Ref BudgetEmail, '']]
  HasSecondBudgetEmail: !Not [!Equals [!Ref BudgetEmail2, '']]

Resources:
  # 部屋（ROOM#コード）と接続（CONN#接続ID）を入れるテーブル。使った分だけの課金で、expiresAt を過ぎると消える
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  GameFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: handler.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  GameFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${GameFunction}
      RetentionInDays: 7

  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: lucky-numbers-online
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action

  GameIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GameFunction.Arn}/invocations

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      Target: !Sub integrations/${GameIntegration}

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      Target: !Sub integrations/${GameIntegration}

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      Target: !Sub integrations/${GameIntegration}

  # 想定外のアクセスで料金が増えないよう、受け付ける数に上限を設ける
  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: prod
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref GameFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  # アカウント全体の今月の料金が上限を超えた（超えそうな）ときにメールで知らせる
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: CreateBudget
    Properties:
      Budget:
        BudgetName: lucky-numbers-online-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
            - !If
              - HasSecondBudgetEmail
              - SubscriptionType: EMAIL
                Address: !Ref BudgetEmail2
              - !Ref AWS::NoValue
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
            - !If
              - HasSecondBudgetEmail
              - SubscriptionType: EMAIL
                Address: !Ref BudgetEmail2
              - !Ref AWS::NoValue

Outputs:
  WebSocketUrl:
    Description: URL for the browser to connect to
    Value: !Sub wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod
